<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LogicBot — Rule-Based AI Chatbot</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#0a0f14;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(0,255,200,.07) 0%, transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(0,150,255,.08) 0%, transparent 40%);
  }
  .app {
    width:100%; max-width:420px; height:100vh; max-height:820px;
    display:flex; flex-direction:column;
    background:linear-gradient(160deg,#0d1520 0%,#101c2a 100%);
    border:1px solid rgba(0,255,200,.15);
    box-shadow:0 0 40px rgba(0,255,200,.08), 0 25px 60px rgba(0,0,0,.6);
    overflow:hidden; position:relative;
  }
  
  header {
    padding:16px 18px; display:flex; align-items:center; gap:12px;
    background:rgba(0,255,200,.05);
    border-bottom:1px solid rgba(0,255,200,.15);
  }
  .avatar {
    width:44px; height:44px; border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #00ffc8, #0077ff);
    display:flex; align-items:center; justify-content:center;
    font-size:22px; position:relative;
    box-shadow:0 0 18px rgba(0,255,200,.5);
  }
  .avatar::after {
    content:''; position:absolute; inset:-4px; border-radius:50%;
    border:2px solid rgba(0,255,200,.4);
    animation:pulse 2s infinite;
  }
  @keyframes pulse { 0%{transform:scale(.9);opacity:1} 100%{transform:scale(1.4);opacity:0} }
  .title h1 { font-size:17px; color:#e8fff8; letter-spacing:1px; }
  .title p { font-size:11px; color:#4de3b8; }
  .status { margin-left:auto; display:flex; align-items:center; gap:6px; font-size:11px; color:#4de3b8; }
  .dot { width:8px; height:8px; border-radius:50%; background:#00ff88; box-shadow:0 0 8px #00ff88; animation:blink 1.6s infinite; }
  @keyframes blink { 50%{opacity:.3} }

  #chat { flex:1; overflow-y:auto; padding:18px 14px; display:flex; flex-direction:column; gap:12px; }
  #chat::-webkit-scrollbar { width:5px; }
  #chat::-webkit-scrollbar-thumb { background:rgba(0,255,200,.25); border-radius:3px; }
  .msg { display:flex; gap:8px; max-width:85%; animation:pop .3s ease; }
  @keyframes pop { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none} }
  .msg.bot { align-self:flex-start; }
  .msg.user { align-self:flex-end; flex-direction:row-reverse; }
  .bubble {
    padding:11px 14px; border-radius:16px; font-size:14px; line-height:1.5;
    word-wrap:break-word; white-space:pre-line;
  }
  .msg.bot .bubble {
    background:rgba(0,255,200,.08); color:#d8fff4;
    border:1px solid rgba(0,255,200,.2);
    border-top-left-radius:4px;
  }
  .msg.user .bubble {
    background:linear-gradient(135deg,#0077ff,#00c8ff); color:#fff;
    border-top-right-radius:4px;
    box-shadow:0 4px 15px rgba(0,140,255,.35);
  }
  .mini-avatar {
    width:28px; height:28px; border-radius:50%; flex-shrink:0;
    background:radial-gradient(circle at 30% 30%, #00ffc8, #0077ff);
    display:flex; align-items:center; justify-content:center; font-size:14px;
  }
  .msg.user .mini-avatar { background:linear-gradient(135deg,#333,#555); }
  .typing { display:flex; gap:5px; padding:14px 16px; }
  .typing span { width:7px; height:7px; border-radius:50%; background:#00ffc8; animation:bounce 1.2s infinite; }
  .typing span:nth-child(2){animation-delay:.15s} .typing span:nth-child(3){animation-delay:.3s}
  @keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:.4} 30%{transform:translateY(-6px);opacity:1} }
  
  .chips { display:flex; gap:8px; padding:8px 14px; overflow-x:auto; flex-shrink:0; }
  .chips::-webkit-scrollbar { display:none; }
  .chip {
    flex-shrink:0; padding:7px 14px; border-radius:20px; font-size:12px;
    background:transparent; color:#4de3b8; border:1px solid rgba(0,255,200,.35);
    cursor:pointer; transition:.2s;
  }
  .chip:active { background:rgba(0,255,200,.15); transform:scale(.95); }
  
  .inputbar {
    display:flex; gap:10px; padding:12px 14px;
    border-top:1px solid rgba(0,255,200,.15); background:rgba(0,0,0,.25);
  }
  #inp {
    flex:1; padding:12px 16px; border-radius:24px; font-size:14px;
    background:rgba(255,255,255,.06); color:#e8fff8;
    border:1px solid rgba(0,255,200,.25); outline:none; transition:.2s;
  }
  #inp:focus { border-color:#00ffc8; box-shadow:0 0 12px rgba(0,255,200,.25); }
  #send {
    width:46px; height:46px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(135deg,#00ffc8,#0077ff); font-size:18px;
    box-shadow:0 4px 15px rgba(0,255,200,.4); transition:.2s;
  }
  #send:active { transform:scale(.9); }
  footer { text-align:center; padding:8px; font-size:10px; color:#3a5a50; letter-spacing:1px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">🤖</div>
    <div class="title">
      <h1>CHATBOT</h1>
      <p>Rule-Based AI Engine · O(1) Lookup</p>
    </div>
    <div class="status"><span class="dot"></span>ONLINE</div>
  </header>

  <div id="chat"></div>

  <div class="chips">
    <button class="chip" onclick="sendChip('hello')">👋 Hello</button>
    <button class="chip" onclick="sendChip('who are you')">🤖 Who are you?</button>
    <button class="chip" onclick="sendChip('joke')">😂 Joke</button>
    <button class="chip" onclick="sendChip('help')">❓ Help</button>
    <button class="chip" onclickChipExit()>🚪 Exit</button>
  </div>

  <div class="inputbar">
    <input id="inp" type="text" placeholder="Type a message..." autocomplete="off">
    <button id="send" onclick="send()">➤</button>
  </div>
  <footer>DECODELABS · PROJECT 1 · THE LOGIC ENGINE</footer>
</div>

<script>
const responses = {
  "hello":"Hello! I'm LogicBot. How can I help you today?",
  "hi":"Hi there! Ask me anything from my knowledge base.",
  "hey":"Hey! Ready when you are.",
  "good morning":"Good morning! Let's build something great today.",
  "who are you":"I'm a rule-based chatbot built with pure control flow and dictionary logic. No deep learning — just deterministic decisions!",
  "what can you do":"I match your input against predefined rules and respond instantly. Try: 'help', 'joke', 'time', or 'bye'.",
  "how are you":"Running at O(1) complexity — perfect, thanks for asking! ⚡",
  "what is your name":"I'm LogicBot, the Phase-1 skeleton of a future AI system.",
  "help":"Available commands: hello, who are you, what can you do, joke, time, bye / exit / quit.",
  "joke":"Why do programmers prefer dark mode? Because light attracts bugs! 🐛",
  "time":"I don't have a real clock yet — adding a 'datetime' rule is a great upgrade for you!",
  "bye":"Goodbye! Thanks for chatting. Shutting down gracefully...",
  "goodbye":"Goodbye! Remember: deterministic today, generative tomorrow.",
  "exit":"Exit command received. Terminating session...",
  "quit":"Exiting loop. It was nice talking to you!"
};
const FALLBACK = "I do not understand. Try 'help' to see what I can do. 🤔";
const EXIT_COMMANDS = ["exit","quit","bye","goodbye"];
const SYNONYMS = {"yo":"hello","sup":"hello","see you":"bye","thanks":"hello"};

const chat = document.getElementById("chat");
const inp = document.getElementById("inp");
let alive = true;

function addMsg(text, who){
  const div = document.createElement("div");
  div.className = "msg " + who;
  const avatar = document.createElement("div");
  avatar.className = "mini-avatar";
  avatar.textContent = who === "bot" ? "🤖" : "🧑";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  div.appendChild(avatar); div.appendChild(bubble);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping(){
  const div = document.createElement("div");
  div.className = "msg bot"; div.id = "typing";
  div.innerHTML = '<div class="mini-avatar">🤖</div><div class="bubble typing"><span></span><span></span><span></span></div>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
function hideTyping(){ const t = document.getElementById("typing"); if(t) t.remove(); }

function getResponse(raw){
  let clean = raw.toLowerCase().trim();          // SANITIZATION
  if (SYNONYMS[clean]) clean = SYNONYMS[clean];
  return responses[clean] || FALLBACK;           // O(1) lookup + fallback
}

function send(){
  if(!alive) return;
  const text = inp.value;
  if(!text.trim()) return;
  addMsg(text, "user");
  inp.value = "";
  showTyping();
  setTimeout(() => {
    hideTyping();
    const clean = text.toLowerCase().trim();
    addMsg(getResponse(text), "bot");
    if(EXIT_COMMANDS.includes(clean)){
      alive = false;
      addMsg("🔴 SESSION TERMINATED — refresh to restart the heartbeat loop.", "bot");
      inp.disabled = true;
    }
  }, 700 + Math.random()*600);
}

function sendChip(text){ inp.value = text; send(); }
function onclickChipExit(){ inp.value = "exit"; send(); }

inp.addEventListener("keydown", e => { if(e.key === "Enter") send(); });

addMsg("⚡ Systems online. LogicBot initialized with 15 deterministic rules.\nType 'help' to explore, or 'exit' to kill the loop.", "bot");
inp.focus();
</script>
</body>
</html>
